<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RB Music — Stream Music You Love</title>
    <link rel="icon" href="/rbmusic/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/rbmusic/favicon.ico" type="image/x-icon" />
    <script>
      (function () {
        var redirect = sessionStorage.getItem("gh-pages-spa");
        if (redirect && redirect !== "/rbmusic/" && redirect !== "/rbmusic") {
          sessionStorage.removeItem("gh-pages-spa");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
